version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_pipeline_db
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce_warehouse}
      POSTGRES_USER: ${DB_USER:-pipeline_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pipeline_user} -d ${DB_NAME:-ecommerce_warehouse}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
